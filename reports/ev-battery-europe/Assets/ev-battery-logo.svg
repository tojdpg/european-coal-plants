<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">European EV Battery Asset Tracker logo</title>
  <desc id="desc">A stylised battery over a dark map-like field with coloured site dots.</desc>
  <defs>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <path d="M90 154c43-42 85-58 128-48 36 9 55 39 91 35 36-3 61-39 101-24" fill="none" stroke="#223143" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
  <path d="M95 329c56-70 103-89 146-59 38 27 64 89 126 52 22-13 39-34 54-61" fill="none" stroke="#223143" stroke-width="20" stroke-linecap="round" opacity="0.44"/>
  <path d="M150 405c51-34 92-39 122-15 32 26 65 25 102-3" fill="none" stroke="#223143" stroke-width="16" stroke-linecap="round" opacity="0.38"/>

  <g filter="url(#shadow)">
    <rect x="91" y="180" width="306" height="158" rx="35" fill="#ffffff" fill-opacity="0.78" stroke="#10151b" stroke-width="24"/>
    <rect x="407" y="226" width="35" height="66" rx="15" fill="#10151b"/>
    <rect x="123" y="212" width="110" height="94" rx="20" fill="url(#cell)"/>
    <rect x="249" y="212" width="110" height="94" rx="20" fill="#fbbf24"/>
  </g>

  <circle cx="165" cy="120" r="18" fill="#16a34a" stroke="#ffffff" stroke-width="7"/>
  <circle cx="332" cy="128" r="15" fill="#0284c7" stroke="#ffffff" stroke-width="7"/>
  <circle cx="112" cy="376" r="16" fill="#d97706" stroke="#ffffff" stroke-width="7"/>
  <circle cx="388" cy="365" r="20" fill="#e11d48" stroke="#ffffff" stroke-width="7"/>
  <circle cx="292" cy="408" r="14" fill="#7c3aed" stroke="#ffffff" stroke-width="7"/>

  <text x="256" y="386" text-anchor="middle" fill="#10151b" stroke="#ffffff" stroke-width="5" paint-order="stroke" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="48" font-weight="760" letter-spacing="2">EV</text>
</svg>
